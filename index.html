<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03A0DC">
  <meta name="description" content="TikTok の動画に出てくる求人番号を入れると、BLUE COLOR の求人ページが開きます。">
  <title>求人番号で探す｜BLUE COLOR 九州沖縄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="logo.png" width="720" height="223" alt="BLUE COLOR 九州・沖縄">
      <p class="lead">動画の<span class="mark">求人番号</span>を入れてね！</p>
      <p class="sub">番号を入れて「探す」を押してね</p>
    </header>

    <section class="search" aria-labelledby="searchTitle">
      <h1 id="searchTitle" class="sr">求人番号で探す</h1>
      <form id="searchForm" novalidate>
        <label class="label" for="jobNo">求人番号</label>
        <div class="row">
          <span class="no" aria-hidden="true">No.</span>
          <input id="jobNo" name="jobNo" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="search"
                 autocomplete="off" autocorrect="off" spellcheck="false" maxlength="20" placeholder="例：295"
                 aria-describedby="jobNoHelp jobNoError">
        </div>
        <p id="jobNoHelp" class="help">動画の中の「求人番号」を入れてください</p>
        <p id="jobNoError" class="error" role="alert" aria-live="assertive" hidden></p>
        <button id="searchBtn" class="btn btn-main" type="submit">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>
          探す
        </button>
        <p id="opening" class="opening" hidden></p>
        <div id="choice" class="choice" hidden></div>
      </form>
    </section>

    <section class="recent" aria-labelledby="recentTitle">
      <h2 id="recentTitle" class="h2">最近の動画の求人</h2>
      <ul id="jobList" class="list" aria-live="polite">
        <li class="empty">読み込んでいます…</li>
      </ul>
    </section>

    <a class="btn btn-sub" href="https://www.bluecolor-kyuujin.com/">公式HPで求人を探す</a>

    <footer class="foot">BLUE COLOR 九州・沖縄</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
